<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin Website Yayasan</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-800 text-sm">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-2xl shadow p-6 w-full max-w-sm">
  <h1 class="text-xl font-extrabold text-emerald-900">Admin Website</h1><p class="text-slate-500 mt-1">Masukkan password admin.</p>
  <input id="pw" type="password" class="mt-4 w-full border rounded-xl px-3 py-2.5" placeholder="Password" autocomplete="current-password">
  <button id="go" class="mt-3 w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl py-2.5">Masuk</button><p id="lerr" class="mt-2 text-red-600"></p></div></div>
<div id="app" class="hidden">
  <header class="bg-emerald-900 text-white sticky top-0 z-30"><div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap">
    <b class="text-base mr-2">Admin Website</b>
    <nav id="tabs" class="flex gap-1 flex-wrap"></nav>
    <span class="flex-1"></span><span id="dirty" class="text-amber-300 hidden">Ada perubahan belum disimpan</span>
    <button id="save" class="bg-amber-400 hover:bg-amber-300 text-emerald-950 font-bold rounded-lg px-4 py-2">Simpan</button>
    <button id="out" class="underline text-white/80">Keluar</button></div></header>
  <main id="main" class="max-w-6xl mx-auto p-4 pb-24"></main>
</div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white rounded-xl px-4 py-2 hidden z-50"></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbyKkoppI6ZNvsVzGOPz4vbBZnErzF9NPjQ6euG_-6Y3HjD8w2ezzE4ZuqEPYwEWBiVI4g/exec";   // dari Deploy > Web app (lihat Code.gs)
const SITE = "index.html";                              // file website (satu folder dengan admin.html)
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const J = ["kober_ra", "mi", "mts", "ma", "umum"];
let PW = sessionStorage.pw || "", T = {}, D = null, SRC = "", FIELDS = [], LOGOS0 = {}, ROWS = {}, TEKS = {}, DIRTY = new Set(), PAGE = "teks";

const toast = (m, bad) => { const t = $("#toast"); t.textContent = m; t.className = "fixed bottom-4 left-1/2 -translate-x-1/2 rounded-xl px-4 py-2 z-50 text-white " + (bad ? "bg-red-600" : "bg-slate-900"); setTimeout(() => t.classList.add("hidden"), 3500); };
async function post(b) { const r = await fetch(API, { method: "POST", body: JSON.stringify({ ...b, password: PW }) }); const j = await r.json(); if (!j.ok) throw new Error(j.error || "Gagal"); return j; }
const mark = t => { DIRTY.add(t); $("#dirty").classList.remove("hidden"); };

/* ---------- gambar: perkecil lalu unggah ke Google Drive ---------- */
function prep(file, max, png) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => { const r = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * r); c.height = Math.round(im.height * r); const x = c.getContext("2d"); if (!png) { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); } x.drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL(png ? "image/png" : "image/jpeg", .86)); }; im.onerror = () => rej(new Error("File bukan gambar")); im.src = URL.createObjectURL(file); }); }
async function upload(file, png) { toast("Mengunggah gambar…"); const keep = png && file.type === "image/png", d = await prep(file, keep ? 900 : 1600, keep); const j = await post({ action: "upload", name: file.name.replace(/\W+/g, "_").slice(0, 40), mime: keep ? "image/png" : "image/jpeg", data: d.split(",")[1] }); toast("Gambar terunggah"); return j.url; }
function imgField(val, png, onSet) { const w = document.createElement("div"); w.className = "flex items-center gap-2"; w.innerHTML = `<img class="h-12 w-12 object-contain bg-slate-100 rounded border" alt=""><input class="flex-1 min-w-0 border rounded-lg px-2 py-1.5" placeholder="Link gambar atau unggah →"><label class="shrink-0 bg-emerald-700 text-white rounded-lg px-3 py-1.5 cursor-pointer font-semibold">Unggah<input type="file" accept="image/*" hidden></label>`; const im = $("img", w), inp = $("input", w), f = $("input[type=file]", w); const show = v => im.src = v ? (v.match(/drive\.google\.com\/file\/d\/([\w-]+)/) ? "https://lh3.googleusercontent.com/d/" + RegExp.$1 + "=w300" : v) : ""; inp.value = val || ""; show(val); inp.oninput = () => { show(inp.value); onSet(inp.value); }; f.onchange = async () => { try { const u = await upload(f.files[0], png); inp.value = u; show(u); onSet(u); } catch (e) { toast(e.message, 1); } f.value = ""; }; return w; }

/* ---------- editor baris generik (tab Sheet) ---------- */
function editor(tab, cols, host, flt, defs, extra) {
  const rows = ROWS[tab], keys = typeof cols === "function" ? null : cols.map(c => c.k);
  host.innerHTML = "";
  const vis = rows.map((r, i) => [r, i]).filter(([r]) => !flt || flt(r)).sort((a, b) => (+a[0].urutan || 1e9) - (+b[0].urutan || 1e9) || a[1] - b[1]);
  const re = () => editor(tab, cols, host, flt, defs, extra);
  vis.forEach(([r, i], n) => {
    const card = document.createElement("div"); card.className = "bg-white rounded-xl border p-3 mb-3";
    const cs = typeof cols === "function" ? cols(r) : cols;
    const g = document.createElement("div"); g.className = "grid sm:grid-cols-2 gap-2";
    cs.forEach(c => { if (c.hide) return; const l = document.createElement("label"); l.className = "block " + (c.t === "a" || c.t === "i" ? "sm:col-span-2" : ""); l.innerHTML = `<span class="text-xs font-semibold text-slate-500">${esc(c.l || c.k)}</span>`;
      let el; if (c.t === "i") el = imgField(r[c.k], c.png, v => { r[c.k] = v; mark(tab); });
      else { el = document.createElement(c.t === "a" ? "textarea" : c.t === "s" ? "select" : "input"); el.className = "block w-full border rounded-lg px-2 py-1.5"; if (c.t === "a") el.rows = c.rows || 3; if (c.t === "s") el.innerHTML = c.o.map(o => `<option ${o === (r[c.k] ?? "") ? "selected" : ""}>${esc(o)}</option>`).join(""); else el.value = r[c.k] ?? ""; if (c.t === "n") el.type = "number"; if (c.ph) el.placeholder = c.ph; el.oninput = el.onchange = () => { r[c.k] = el.value; mark(tab); if (c.re) re(); }; }
      l.appendChild(el); if (c.h) l.insertAdjacentHTML("beforeend", `<span class="text-xs text-slate-400">${esc(c.h)}</span>`); g.appendChild(l); });
    card.appendChild(g);
    const bar = document.createElement("div"); bar.className = "mt-2 flex gap-2 text-xs";
    bar.innerHTML = `<button class="px-2 py-1 rounded bg-slate-100">↑</button><button class="px-2 py-1 rounded bg-slate-100">↓</button><button class="px-2 py-1 rounded bg-red-50 text-red-700 ml-auto">Hapus</button>`;
    const [u, d, x] = bar.children;
    const move = dir => { const o = vis[n + dir]; if (!o) return; if (!cs.some(c => c.k === "urutan")) { const j = o[1]; [rows[i], rows[j]] = [rows[j], rows[i]]; mark(tab); re(); return; } vis.splice(n, 1); vis.splice(n + dir, 0, [r, i]); vis.forEach(([q], k) => { if ("urutan" in q || cs.some(c => c.k === "urutan")) q.urutan = String(k + 1); }); mark(tab); re(); };
    u.onclick = () => move(-1); d.onclick = () => move(1);
    x.onclick = () => { if (confirm("Hapus baris ini?")) { rows.splice(rows.indexOf(r), 1); if (extra && extra.onDelete) extra.onDelete(r); mark(tab); re(); } };
    card.appendChild(bar); if (extra && extra.after) extra.after(r, card); host.appendChild(card);
  });
  const add = document.createElement("button"); add.className = "bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-lg px-4 py-2"; add.textContent = "+ Tambah";
  add.onclick = () => { const o0 = defs ? defs(vis) : {}; if (o0 === null) return; const o = { ...o0 }; if (!("urutan" in o)) o.urutan = String(vis.length + 1); rows.push(o); mark(tab); re(); };
  host.appendChild(add);
}

/* ---------- definisi kolom tab ---------- */
const jc = { k: "jenjang", l: "Jenjang", t: "s", o: J };
const COLS = {

  jadwal: [jc, { k: "gelombang" }, { k: "periode_pendaftaran", l: "Periode pendaftaran" }, { k: "tanggal_tes", l: "Tanggal tes" }, { k: "status", l: "Status", ph: "Dibuka / Segera / Ditutup" }],
  biaya: [jc, { k: "urutan", t: "n" }, { k: "label", l: "Nama biaya" }, { k: "nilai", l: "Nominal" }, { k: "catatan", l: "Catatan" }, { k: "sorot", l: "Disorot?", t: "s", o: ["tidak", "ya"] }],
  program: [jc, { k: "item", l: "Program unggulan" }],
  berkas: [jc, { k: "item", l: "Berkas persyaratan" }],
  foto: [{ k: "kategori", l: "Kategori", h: "kober_ra, mi, mts, ma, dku_anak_asuh, dku_apresiasi_guru, dku_bakti_sosial, dku_klinik, siso, …" }, { k: "url_foto", l: "Foto", t: "i" }, { k: "keterangan", l: "Keterangan" }, { k: "urutan", t: "n" }],
  video: [{ k: "kategori", l: "Kategori" }, { k: "url_youtube", l: "Link YouTube" }, { k: "judul", l: "Judul video" }, { k: "urutan", t: "n" }]
};
const BCOL = [{ k: "nama", l: "Nama bidang / satuan kerja" }, { k: "label", l: "Label kecil", ph: "Bidang Usaha" }, { k: "ringkas", l: "Kalimat pembuka", t: "a", rows: 2 }, { k: "logo", l: "Logo", t: "i", png: 1 }, { k: "warna", l: "Warna tema", t: "s", o: ["orange", "sky", "emerald", "rose", "violet", "amber", "teal"] }, { k: "tampil", l: "Tampilkan di website?", t: "s", o: ["ya", "tidak"] }];
const TIPE = {
  paragraf: ["Paragraf", { judul: "Judul", isi: "Paragraf" }], daftar: ["Daftar centang", { judul: "Judul", isi: "Satu poin per baris" }], tag: ["Label/chip", { judul: "Judul", isi: "Satu label per baris" }],
  kartu: ["Kartu program (foto + teks)", { judul: "Judul program", isi: "Deskripsi", gambar: "Foto" }], kutipan: ["Kutipan / dalil", { judul: "Sumber", isi: "Teks kutipan" }],
  sorotan: ["Sorotan angka", { judul: "Angka/kata besar", tautan: "Label kecil", isi: "Penjelasan" }], donasi: ["Info donasi / rekening", { judul: "Ajakan", isi: "3 baris: Nama bank / No. rekening / Atas nama", gambar: "Gambar QRIS", tautan: "No. WhatsApp konfirmasi" }],
  tombol: ["Tombol tautan", { isi: "Satu per baris: Label | link (atau nomor WA)" }], video: ["Video YouTube", { judul: "Judul bagian", isi: "Satu per baris: link YouTube | judul" }], galeri: ["Galeri foto", { judul: "Judul", isi: "Satu per baris: link foto | keterangan (atau klik Unggah beberapa foto)" }]
};
const blokCols = r => { const f = (TIPE[r.tipe] || TIPE.paragraf)[1], o = [{ k: "tipe", l: "Jenis isi", t: "s", o: Object.keys(TIPE), re: 1, h: "" }];
  const L = { judul: "judul", isi: "isi", gambar: "gambar", tautan: "tautan" }; Object.keys(L).forEach(k => { if (!f[k]) return; const c = { k, l: f[k] }; if (k === "isi") { c.t = "a"; c.rows = 5; } if (k === "gambar") { c.t = "i"; c.png = 1; } o.push(c); }); return o; };

/* ---------- halaman ---------- */
const PAGES = { teks: "Teks & Gambar", data: "Jenjang & Data", bidang: "Bidang / Satuan Kerja Baru", preview: "Tampilan Link (WA/Medsos)" };
function nav() { $("#tabs").innerHTML = Object.entries(PAGES).map(([k, v]) => `<button data-p="${k}" class="px-3 py-1.5 rounded-lg ${k === PAGE ? "bg-white text-emerald-900 font-bold" : "bg-white/10 hover:bg-white/20"}">${v}</button>`).join(""); $("#tabs").onclick = e => { const p = e.target.dataset.p; if (p) { PAGE = p; show(); } }; }
function show() { nav(); const m = $("#main"); m.innerHTML = ""; ({ teks: pgTeks, data: pgData, bidang: pgBidang, preview: pgPreview })[PAGE](m); }
const GN = { topbar: "Bar atas", menu: "Menu navigasi", beranda: "Beranda (hero)", jenjang: "Judul jenjang", alur: "Alur pendaftaran", sosial: "Bidang Sosial (DKU)", usaha: "Bidang Usaha (SISO)", kontak: "Kontak & lokasi", footer: "Footer", fab: "Tombol WhatsApp" };

function pgTeks(m) {
  m.innerHTML = `<p class="mb-3 text-slate-600">Ubah teks, logo, gambar, dan tautan yang sudah ada di website. Hanya yang <b>berbeda dari bawaan</b> yang disimpan. Kosongkan isian untuk kembali ke teks bawaan.</p>
  <div class="flex gap-2 flex-wrap mb-3"><input id="q" placeholder="Cari teks…" class="border rounded-lg px-3 py-2 flex-1 min-w-[200px]"><select id="gsel" class="border rounded-lg px-3 py-2"><option value="">Semua bagian</option><option value="logo">Logo</option>${Object.entries(GN).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div><div id="fl"></div>`;
  const draw = () => { const q = $("#q").value.toLowerCase(), gs = $("#gsel").value, fl = $("#fl"); fl.innerHTML = "";
    const all = [...Object.keys(LOGOS0).map(k => ({ key: "logo." + k, type: "img", def: LOGOS0[k], g: "logo", png: 1, lab: "Logo " + k })), ...FIELDS];
    all.filter(f => (!gs || f.g === gs) && (!q || (f.def + f.key + (TEKS[f.key] || "")).toLowerCase().includes(q))).slice(0, 150).forEach(f => {
      const w = document.createElement("div"); w.className = "bg-white rounded-xl border p-3 mb-2"; w.innerHTML = `<div class="text-xs font-semibold text-slate-400 mb-1">${esc(GN[f.g] || "Logo")} · ${f.type === "img" ? "gambar" : f.type === "href" ? "tautan" : "teks"}</div>`;
      const set = v => { v = v.trim(); if (v) TEKS[f.key] = v; else delete TEKS[f.key]; mark("teks"); };
      if (f.type === "img") w.appendChild(imgField(TEKS[f.key] || (f.def.startsWith("data:") ? "" : f.def), f.png, set)), f.def.startsWith("data:") && w.insertAdjacentHTML("beforeend", `<div class="mt-1 flex items-center gap-2 text-xs text-slate-500">Bawaan: <img src="${f.def}" class="h-8 object-contain border rounded"></div>`);
      else { const el = document.createElement(f.def.length > 70 ? "textarea" : "input"); el.className = "w-full border rounded-lg px-2 py-1.5"; if (el.tagName === "TEXTAREA") el.rows = Math.min(8, Math.ceil(f.def.length / 80)); el.value = TEKS[f.key] ?? f.def; el.oninput = () => set(el.value === f.def ? "" : el.value); w.appendChild(el); }
      fl.appendChild(w); }); };
  $("#q").oninput = $("#gsel").onchange = draw; draw();
}
function pgData(m) {
  m.innerHTML = `<div class="flex gap-1 flex-wrap mb-2" id="dt"></div><div class="mb-3 flex gap-2 items-center"><select id="jf" class="border rounded-lg px-3 py-2"><option value="">Semua jenjang</option>${J.map(j => `<option>${j}</option>`).join("")}</select><span class="text-slate-500" id="note"></span></div><div id="ed"></div>`;
  let cur = window._dt || "info"; const names = { info: "Info & kontak", jadwal: "Jadwal", biaya: "Biaya", program: "Program unggulan", berkas: "Berkas", foto: "Foto kegiatan", video: "Video" };
  const draw = () => { $("#dt").innerHTML = Object.entries(names).map(([k, v]) => `<button data-t="${k}" class="px-3 py-1.5 rounded-lg ${k === cur ? "bg-emerald-700 text-white" : "bg-white border"}">${v}</button>`).join(""); $("#jf").style.display = COLS[cur][0].k === "jenjang" ? "" : "none";
    $("#note").textContent = (T[cur] || []).length ? "" : (cur in seed() ? "Belum ada di Sheet: ini data bawaan website. Klik Simpan untuk memindahkannya ke Sheet." : "");
    const f = $("#jf").value; editor(cur, COLS[cur], $("#ed"), f && COLS[cur][0].k === "jenjang" ? r => r.jenjang === f : null, () => (f && COLS[cur][0].k === "jenjang" ? { jenjang: f } : {})); };
  $("#dt").onclick = e => { if (e.target.dataset.t) { cur = window._dt = e.target.dataset.t; draw(); } }; $("#jf").onchange = draw; draw();
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 24) || "bidang";
function pgBidang(m) {
  m.innerHTML = `<p class="mb-3 text-slate-600">Buat bidang/satuan kerja baru (mis. Bidang Dakwah, Koperasi). Tiap bidang tampil sebagai bagian sendiri di website, tersusun dari <b>blok isi</b> yang bisa ditambah dan diurutkan. Bidang Sosial (DKU) dan Usaha (SISO) yang sudah ada diedit di halaman <i>Teks & Gambar</i>.</p><div id="ed"></div>`;
  editor("bidang", BCOL, $("#ed"), null, v => { const nm = prompt("Nama bidang / satuan kerja baru:"); if (!nm) return null; let id = slug(nm), n = 2; while (ROWS.bidang.some(r => r.id === id)) id = slug(nm) + n++; return { id, nama: nm, label: "Bidang", warna: "orange", tampil: "ya" }; }, {
    after: (r, card) => { if (!r.id) return; const d = document.createElement("details"); d.className = "mt-3 border-t pt-3"; d.open = true; d.innerHTML = `<summary class="font-bold text-emerald-900 cursor-pointer">Isi bidang ini (blok)</summary><div class="mt-3" id="b_${r.id}"></div>`; card.appendChild(d);
      editor("blok", blokCols, $("#b_" + r.id, d), x => x.bidang === r.id, () => ({ bidang: r.id, tipe: "paragraf" }), { after: (x, c2) => { if (x.tipe === "galeri") { const b = document.createElement("label"); b.className = "mt-2 inline-block bg-emerald-700 text-white rounded-lg px-3 py-1.5 cursor-pointer text-xs font-semibold"; b.innerHTML = `Unggah beberapa foto<input type="file" accept="image/*" multiple hidden>`; $("input", b).onchange = async e => { for (const f of e.target.files) { try { x.isi = (x.isi ? x.isi + "\n" : "") + (await upload(f)); mark("blok"); } catch (er) { toast(er.message, 1); } } show(); }; c2.insertBefore(b, c2.lastChild); } } }); },
    onDelete: r => { ROWS.blok = ROWS.blok.filter(x => x.bidang !== r.id); mark("blok"); }
  });
}
/* ---------- tampilan link preview ---------- */
const MK = [["title", "Judul tab browser"], ["metadesc", "Deskripsi mesin pencari"], ["ogtitle", "Judul saat link dibagikan"], ["ogdesc", "Deskripsi saat link dibagikan"], ["ogimg", "Gambar saat link dibagikan"]];
function metaDefaults() { const g = (re) => (SRC.match(re) || [, ""])[1].replace(/&amp;/g, "&").replace(/&quot;/g, '"'); return { title: g(/<title>([\s\S]*?)<\/title>/), metadesc: g(/<meta name="description" content="([^"]*)"/), ogtitle: g(/<meta property="og:title" content="([^"]*)"/), ogdesc: g(/<meta property="og:description" content="([^"]*)"/), ogimg: g(/<meta property="og:image" content="([^"]*)"/) }; }
function pgPreview(m) {
  const d = metaDefaults(), v = k => TEKS["meta." + k] ?? d[k];
  m.innerHTML = `<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-amber-900"><b>Penting:</b> WhatsApp & media sosial membaca tampilan link dari file <code>index.html</code> langsung (tanpa menjalankan Sheet). Jadi setelah menyimpan di sini, klik <b>Unduh index.html baru</b> lalu unggah file itu ke hosting website. Setelah itu, untuk menyegarkan pratinjau lama: tempel link ke <i>Facebook Sharing Debugger</i> atau tambahkan <code>?v=2</code> di akhir link saat dibagikan di WhatsApp.</div>
  <div class="grid lg:grid-cols-2 gap-4"><div id="mf" class="bg-white rounded-xl border p-4 space-y-3"></div>
  <div><div class="text-xs font-semibold text-slate-500 mb-1">Pratinjau (seperti di WhatsApp)</div><div class="bg-[#1f2c34] text-white rounded-xl overflow-hidden flex gap-0 max-w-md"><img id="pi" class="w-28 h-28 object-cover bg-slate-700 shrink-0"><div class="p-3 min-w-0"><div id="pt" class="font-bold leading-snug"></div><div id="pd" class="text-white/70 text-xs mt-1 line-clamp-3"></div><div class="text-white/40 text-xs mt-1">www.annaiim.sch.id</div></div></div>
  <button id="dl" class="mt-4 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl px-5 py-3">Unduh index.html baru</button></div></div>`;
  const upd = () => { $("#pi").src = v("ogimg"); $("#pt").textContent = v("ogtitle"); $("#pd").textContent = v("ogdesc"); }; const mf = $("#mf");
  MK.forEach(([k, l]) => { const w = document.createElement("label"); w.className = "block"; w.innerHTML = `<span class="text-xs font-semibold text-slate-500">${l}</span>`; const set = x => { TEKS["meta." + k] = x; mark("teks"); upd(); };
    if (k === "ogimg") { w.appendChild(imgField(v(k), 0, set)); w.insertAdjacentHTML("beforeend", `<span class="text-xs text-slate-400">Ukuran ideal 1200×630 px (landscape).</span>`); } else { const el = document.createElement(/desc/.test(k) ? "textarea" : "input"); el.className = "block w-full border rounded-lg px-2 py-1.5"; if (el.tagName === "TEXTAREA") el.rows = 3; el.value = v(k); el.oninput = () => set(el.value); w.appendChild(el); } mf.appendChild(w); });
  upd(); $("#dl").onclick = () => { let h = SRC; const a = x => String(x).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

/* ---------- data bawaan website ---------- */
function seed() { if (!D) return {}; const J = D.jenjang, o = D.urutan; return {
  info: [...o.map(k => ({ jenjang: k, nomor_wa: J[k].wa, kontak_nama: J[k].kontak, tagline: J[k].tagline, promo_text: J[k].promo, kuota_text: J[k].kuota, catatan_biaya: J[k].catatan_biaya })), { jenjang: "umum", nomor_wa: D.config.wa_umum }],
  jadwal: o.flatMap(k => J[k].jadwal.map(g => ({ jenjang: k, gelombang: g.gelombang, periode_pendaftaran: g.periode, tanggal_tes: g.tes, status: g.status }))),
  biaya: o.flatMap(k => J[k].biaya.map((b, i) => ({ jenjang: k, urutan: String(i + 1), label: b.label, nilai: b.nilai, catatan: b.catatan, sorot: b.sorot ? "ya" : "tidak" }))),
  program: o.flatMap(k => J[k].program.map(p => ({ jenjang: k, item: p }))), berkas: o.flatMap(k => J[k].berkas.map(p => ({ jenjang: k, item: p }))) }; }
const HEAD = { info: COLS.info, jadwal: COLS.jadwal, biaya: COLS.biaya, program: COLS.program, berkas: COLS.berkas, foto: COLS.foto, video: COLS.video, bidang: [{ k: "id" }, ...BCOL, { k: "urutan" }], blok: ["bidang", "urutan", "tipe", "judul", "isi", "gambar", "tautan"].map(k => ({ k })) };

async function loadSite() {
  SRC = await (await fetch(SITE + "?t=" + Date.now())).text();
  let i = SRC.indexOf("FALLBACK_DATA = {"), j = SRC.indexOf("\n};", i) + 3; D = new Function("return " + SRC.slice(i + 16, j - 1))();
  i = SRC.indexOf("const LOGOS = {"); j = SRC.indexOf("\n};", i) + 3; LOGOS0 = new Function("return " + SRC.slice(i + 14, j - 1))();
  const doc = new DOMParser().parseFromString(SRC, "text/html");
  FIELDS = [...doc.querySelectorAll("[data-edit],[data-img],[data-href]")].map(e => { const t = e.dataset.edit ? "edit" : e.dataset.img ? "img" : "href", key = e.dataset.edit || e.dataset.img || e.dataset.href; return { key, type: t === "edit" ? "edit" : t, def: t === "edit" ? e.textContent.trim() : t === "img" ? e.getAttribute("src") : e.getAttribute("href"), g: key.split(".")[0] }; });
}
async function loadData() {
  T = await (await fetch(API + "?t=" + Date.now())).json(); const sd = seed();
  Object.keys(HEAD).forEach(t => { ROWS[t] = (T[t] && T[t].length ? T[t] : (sd[t] || [])).map(r => ({ ...r })); });
  TEKS = {}; (T.teks || []).forEach(r => { if (r.kunci) TEKS[r.kunci] = r.nilai; });
}
async function saveAll() {
  if (!DIRTY.size) return toast("Tidak ada perubahan");
  try { for (const t of [...DIRTY]) { if (t === "teks") { const rows = Object.entries(TEKS).filter(([, v]) => v !== "" && v != null).map(([k, v]) => [k, v]); await post({ action: "save", tab: "teks", header: ["kunci", "nilai"], rows }); }
    else { const ks = HEAD[t].map(c => c.k); if (t === "bidang" || t === "blok") ROWS[t].forEach((r, i) => { if (!r.urutan) r.urutan = String(i + 1); }); await post({ action: "save", tab: t, header: ks, rows: ROWS[t].map(r => ks.map(k => r[k] ?? "")) }); } DIRTY.delete(t); }
    $("#dirty").classList.add("hidden"); toast("Tersimpan. Website akan menampilkan perubahan dalam beberapa menit."); } catch (e) { toast(e.message, 1); } }
async function start() { try { await Promise.all([loadSite(), loadData()]); $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); show(); } catch (e) { $("#lerr").textContent = "Gagal memuat: " + e.message; $("#login").classList.remove("hidden"); $("#app").classList.add("hidden"); } }
$("#go").onclick = async () => { PW = $("#pw").value; try { if (API.startsWith("PASTE")) throw new Error("Isi dulu konstanta API di admin.html"); await post({ action: "login" }); sessionStorage.pw = PW; start(); } catch (e) { $("#lerr").textContent = e.message; } };
$("#pw").onkeydown = e => { if (e.key === "Enter") $("#go").click(); };
$("#save").onclick = saveAll; $("#out").onclick = () => { sessionStorage.clear(); location.reload(); };
addEventListener("beforeunload", e => { if (DIRTY.size) e.preventDefault(); });
if (PW) start();
